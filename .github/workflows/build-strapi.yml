name: Build Strapi

on:
  push:
    branches: [ "dev", "stg", "prod" ]
  pull_request:
    branches: [ "dev", "stg", "prod" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm install -g "$(node -p "require('./package.json').packageManager")"
    - run: npm ci
    - run: npm run build
